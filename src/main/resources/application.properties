spring.application.name=gym-crm

# Shared Hibernate settings. Connection details are profile-specific.
spring.jpa.show-sql=${HIBERNATE_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.prometheus.metrics.export.enabled=true
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=TRAINEE,TRAINER
management.info.env.enabled=true

info.application.name=Gym CRM
info.application.version=@project.version@

spring.h2.console.path=/h2-console

# Reports integration is disabled by default so dev and test remain standalone.
gym.integrations.reports.enabled=${GYM_REPORTS_INTEGRATION_ENABLED:false}
gym.messaging.trainer-workload-queue=${TRAINER_WORKLOAD_QUEUE:trainer.workload}
gym.reports.base-url=${GYM_REPORTS_BASE_URL:http://localhost:8081}
gym.reports.connect-timeout=${GYM_REPORTS_CONNECT_TIMEOUT:2s}
gym.reports.read-timeout=${GYM_REPORTS_READ_TIMEOUT:3s}
management.health.jms.enabled=${GYM_REPORTS_INTEGRATION_ENABLED:false}
