spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/gymcrm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gymcrm}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

gym.integrations.reports.enabled=true
gym.messaging.trainer-workload-queue=${TRAINER_WORKLOAD_QUEUE:trainer.workload}

spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://activemq:61616}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD}

gym.reports.base-url=${GYM_REPORTS_BASE_URL:http://reports:8081}
gym.reports.connect-timeout=${GYM_REPORTS_CONNECT_TIMEOUT:2s}
gym.reports.read-timeout=${GYM_REPORTS_READ_TIMEOUT:3s}

management.health.jms.enabled=true
